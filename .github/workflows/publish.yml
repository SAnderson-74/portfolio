name: Build and publish image

# Runs on every push to main. workflow_dispatch adds a "Run workflow" button
# in the Actions tab so you can trigger it by hand without making a commit.
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest

    # Least privilege. The default token can do a lot; this narrows it to
    # reading the repo and writing packages, which is all this job needs.
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      # BuildKit. Enables layer cache export, which the cache steps below use.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      # GITHUB_TOKEN is generated automatically for each run and expires when
      # the run ends. There is no secret for you to create or rotate.
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Works out the tags and labels for this build. It also lowercases the
      # image name, which matters because GHCR rejects uppercase and GitHub
      # usernames can contain it.
      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          # Only amd64. The runner is natively x86_64, so this builds at full
          # speed with no emulation. Add linux/arm64 here if you ever need to
          # run the same image on a Pi or an Apple Silicon host.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Persist Docker layers in the Actions cache between runs, so npm ci
          # is not repeated when only site content changed.
          cache-from: type=gha
          cache-to: type=gha,mode=max
